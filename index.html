<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f6bf6'/%3E%3Cpath d='M9 22V10l7 8 7-8v12' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="拾光 · 个人网址导航" />
    <meta name="theme-color" content="#5b5ce2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/pwa-192.png" />
    <title>拾光 · 个人导航</title>
    <script>
      // 首屏防闪烁：在渲染前按本地配置挂上 dark class、强调色与背景灰调（v2 优先，兼容 v1）
      try {
        var raw = localStorage.getItem('shiguang.nav.v2') || localStorage.getItem('shiguang.nav.v1');
        var s = raw ? JSON.parse(raw).settings || {} : {};
        var t = s.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var ALIAS = { indigo: 'purple', sky: 'blue', emerald: 'green', rose: 'red', amber: 'orange' };
        var a = ALIAS[s.accent] || s.accent;
        if (a && a !== 'purple') document.documentElement.dataset.accent = a;
        if (a === 'custom' && s.accentCustom) {
          document.documentElement.style.setProperty('--accent-custom', s.accentCustom);
        }
        if (s.bgStyle && s.bgStyle !== 'zinc') document.documentElement.dataset.bg = s.bgStyle;
        if (s.monoIcons) document.documentElement.dataset.mono = '1';
        if (s.oledBlack) document.documentElement.dataset.oled = '1';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
